name: Release

# Publishes crates to crates.io in dependency order when a `v*` tag is
# pushed. Requires the `CARGO_REGISTRY_TOKEN` repository secret.

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    name: publish ${{ matrix.crate }}
    runs-on: ubuntu-latest
    strategy:
      # Dependency order: publish each crate sequentially; a failure stops
      # the rest (rerun the tag after fixing).
      max-parallel: 1
      fail-fast: true
      matrix:
        crate:
          - tpt-av-control-utils
          - tpt-av-control-osc
          - tpt-av-control-midi
          - tpt-av-control-dmx
          - tpt-av-control-surface
          - tpt-av-control-webrtc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify version matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared=$(cargo metadata --no-deps --format-version 1 | jq -r ".packages[] | select(.name == \"${{ matrix.crate }}\") | .version")
          if [ "$tag" != "$declared" ]; then
            echo "tag v$tag != ${{ matrix.crate }} version $declared" >&2
            exit 1
          fi
      - name: Dry run
        run: cargo package -p ${{ matrix.crate }}
      - name: Publish
        run: cargo publish -p ${{ matrix.crate }} --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    name: github release
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

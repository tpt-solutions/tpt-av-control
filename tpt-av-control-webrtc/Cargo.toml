[package]
name = "tpt-av-control-webrtc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "WebRTC data channel transport for networked AV control"
readme = "README.md"
documentation = "https://docs.rs/tpt-av-control-webrtc"
homepage = "https://opensource.tptsolutions.co.nz/"
keywords = ["webrtc", "data-channel", "remote-control", "network", "real-time"]
categories = ["multimedia", "network-programming"]

[dependencies]
tpt-av-control-utils = { workspace = true }
log = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { version = "1.0", optional = true }

[features]
default = []
json = ["dep:serde", "dep:serde_json"]

[dev-dependencies]
tpt-av-test-fuzz = { workspace = true }
proptest = { workspace = true }

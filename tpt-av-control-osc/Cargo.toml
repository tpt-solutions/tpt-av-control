[package]
name = "tpt-av-control-osc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Open Sound Control (OSC 1.0/1.1) implementation for the TPT AV control suite"
readme = "README.md"
documentation = "https://docs.rs/tpt-av-control-osc"
homepage = "https://opensource.tptsolutions.co.nz/"
keywords = ["osc", "sound-control", "udp", "audio", "protocol"]
categories = ["multimedia::audio", "network-programming", "parsing"]

[dependencies]
tpt-av-control-utils = { workspace = true }
log = { workspace = true }
tokio = { workspace = true, features = ["net"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tpt-av-test-fuzz = { workspace = true }
tpt-av-test-benchmark = { workspace = true }
proptest = { workspace = true }

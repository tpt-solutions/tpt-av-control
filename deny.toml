# cargo-deny configuration for tpt-av-control.
# Enforces the project's permissive-only dependency policy:
# everything not explicitly allowed below is denied, so GPL/LGPL/AGPL/MPL
# dependencies fail the check.
# Run with: cargo deny check licenses bans

[graph]
all-features = true

[licenses]
# SPDX expressions we accept. Anything else (including unlicensed crates)
# is denied.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
confidence-threshold = 0.8
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
deny = [
    # Banned per project policy: GPL MIDI stacks.
    { name = "rtmidi" },
    { name = "portmidi" },
]

[advisories]
yanked = "warn"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
